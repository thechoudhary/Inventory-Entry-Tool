<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1e293b;
    background: transparent;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
  }

  /* Base tile */
  .tile {
    position: relative;
    height: 168px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 8px;
    background: #fff;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: box-shadow 0.18s, transform 0.15s, border-color 0.15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .tile:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    transform: translateY(-2px);
    border-color: #cbd5e1;
  }
  .tile.dragging {
    opacity: 0.45;
    border: 2px dashed #94a3b8;
    transform: scale(0.95);
    cursor: grabbing;
  }
  .tile.over {
    outline: 2px solid #2563eb;
    outline-offset: 1px;
    background: #eff6ff;
  }

  /* Image */
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    border-radius: 6px;
  }

  /* Loading spinner overlay */
  .tile-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    border-radius: 10px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid #e2e8f0;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error state */
  .tile-error {
    font-size: 11px;
    color: #dc2626;
    text-align: center;
    padding: 6px;
    line-height: 1.4;
  }

  /* Position badge */
  .badge {
    position: absolute;
    left: 6px; top: 6px;
    background: rgba(15, 23, 42, 0.68);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    pointer-events: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .badge.cover { background: #2563eb; }

  /* Remove button — hidden until hover */
  .remove {
    position: absolute;
    right: 6px; top: 6px;
    width: 24px; height: 24px;
    border: 0;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.72);
    color: #fff;
    font-size: 14px;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, background 0.12s;
  }
  .tile:hover .remove { opacity: 1; }
  .remove:hover { background: #dc2626; }

  /* Add tile */
  .add-tile {
    cursor: default;
    flex-direction: column;
    gap: 8px;
    border: 1.5px dashed #cbd5e1;
    background: #f8fafc;
    padding: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .add-tile:hover {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .plus { font-size: 28px; color: #94a3b8; line-height: 1; }
  .add-tile:hover .plus { color: #2563eb; }
  .add-tile input {
    width: 100%; min-width: 0;
    padding: 7px 9px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 11px;
    outline: none;
    transition: border-color 0.15s;
  }
  .add-tile input:focus { border-color: #2563eb; }
  .add-tile button {
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: #2563eb;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s;
  }
  .add-tile button:hover { background: #1d4ed8; }
  .add-tile .hint-enter {
    font-size: 10px;
    color: #94a3b8;
    text-align: center;
    margin-top: 2px;
  }

  .hint { font-size: 12px; color: #64748b; margin: 0 0 10px; }
  .empty { color: #94a3b8; font-size: 13px; text-align: center; padding: 2rem 0; width: 100%; }
</style>
</head>
<body>
<p class="hint">Drag images to rearrange. The first image is the cover. Hover a tile to remove it.</p>
<div id="grid" class="grid"></div>
<script>
(function () {
  let images = [];
  let draggedIndex = null;
  let componentKey = null;
  const grid = document.getElementById('grid');

  function sendValue() {
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: images, dataType: 'json'}, '*');
  }

  function validUrl(value) {
    try { const u = new URL(value); return u.protocol === 'https:' || u.protocol === 'http:'; }
    catch (_) { return false; }
  }

  function resizeFrame() {
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: Math.max(260, document.body.scrollHeight + 8)}, '*');
  }

  function createImageTile(url, index) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.draggable = true;
    tile.dataset.index = index;
    tile.title = url;

    // Loading spinner
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'tile-loading';
    const spinnerEl = document.createElement('div');
    spinnerEl.className = 'spinner';
    loadingDiv.appendChild(spinnerEl);

    // Image
    const img = document.createElement('img');
    img.alt = 'Product image ' + (index + 1);
    img.style.display = 'none';
    img.onload = () => {
      loadingDiv.style.display = 'none';
      img.style.display = '';
    };
    img.onerror = () => {
      loadingDiv.innerHTML = '<div class="tile-error">Could not load image</div>';
    };
    img.src = url;

    // Position badge
    const badge = document.createElement('div');
    badge.className = index === 0 ? 'badge cover' : 'badge';
    badge.textContent = index === 0 ? 'Cover' : String(index + 1);

    // Remove button
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = 'Remove image';
    remove.addEventListener('click', (e) => {
      e.stopPropagation();
      images.splice(index, 1);
      render();
      sendValue();
    });

    tile.appendChild(loadingDiv);
    tile.appendChild(img);
    tile.appendChild(badge);
    tile.appendChild(remove);

    tile.addEventListener('dragstart', (event) => {
      draggedIndex = index;
      tile.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(index));
    });
    tile.addEventListener('dragend', () => {
      draggedIndex = null;
      tile.classList.remove('dragging');
      document.querySelectorAll('.tile.over').forEach(el => el.classList.remove('over'));
    });
    tile.addEventListener('dragover', (event) => {
      event.preventDefault();
      tile.classList.add('over');
      event.dataTransfer.dropEffect = 'move';
    });
    tile.addEventListener('dragleave', () => tile.classList.remove('over'));
    tile.addEventListener('drop', (event) => {
      event.preventDefault();
      tile.classList.remove('over');
      const from = draggedIndex;
      const to = index;
      if (from !== null && from !== to && from >= 0 && from < images.length) {
        const moved = images.splice(from, 1)[0];
        images.splice(to, 0, moved);
        render();
        sendValue();
      }
    });

    return tile;
  }

  function render() {
    grid.innerHTML = '';
    if (!images.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No images yet. Add an image URL using the + tile below.';
      grid.appendChild(empty);
    }
    images.forEach((url, index) => {
      grid.appendChild(createImageTile(url, index));
    });

    // Add tile
    const addTile = document.createElement('div');
    addTile.className = 'tile add-tile';
    const plus = document.createElement('div');
    plus.className = 'plus';
    plus.textContent = '+';
    const input = document.createElement('input');
    input.type = 'url';
    input.placeholder = 'Paste image URL';
    input.setAttribute('aria-label', 'New image URL');
    const hintEnter = document.createElement('div');
    hintEnter.className = 'hint-enter';
    hintEnter.textContent = 'Press Enter to add URL';
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '📁 Add image';
    // Enter key adds URL; button opens the upload dialog
    const doAddUrl = () => {
      const url = input.value.trim();
      if (!validUrl(url)) {
        input.setCustomValidity('Enter a valid http or https image URL.');
        input.reportValidity();
        return;
      }
      input.setCustomValidity('');
      if (!images.includes(url)) images.push(url);
      input.value = '';
      render();
      sendValue();
    };
    const doOpenUpload = () => {
      // Signal Python to open the upload dialog
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setComponentValue',
        value: { action: 'upload_open', images: images.slice() },
        dataType: 'json'
      }, '*');
    };
    button.addEventListener('click', doOpenUpload);
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); doAddUrl(); } });
    addTile.appendChild(plus);
    addTile.appendChild(input);
    addTile.appendChild(hintEnter);
    addTile.appendChild(button);
    grid.appendChild(addTile);

    requestAnimationFrame(resizeFrame);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data || {};
    if (msg.type === 'streamlit:render') {
      const args = msg.args || {};
      const incomingKey = args.component_key || '';
      if (componentKey !== incomingKey) {
        componentKey = incomingKey;
        images = Array.isArray(args.images) ? args.images.slice() : [];
        render();
      } else if (!images.length && Array.isArray(args.images) && args.images.length) {
        images = args.images.slice();
        render();
      }
    }
  });

  window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1}, '*');
  if (window.ResizeObserver) new ResizeObserver(resizeFrame).observe(document.body);
  window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: 260}, '*');
})();
</script>
</body>
</html>
