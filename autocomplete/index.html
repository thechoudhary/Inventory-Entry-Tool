<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: transparent;
  overflow: visible;
}

/* ── Label ─────────────────────────────── */
.ac-label {
  display: block;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Input row ─────────────────────────── */
.ac-input-row {
  position: relative;
}
.ac-input {
  width: 100%;
  padding: 9px 34px 9px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 14px;
  color: #0f172a;
  background: #fff;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.ac-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.ac-input::placeholder { color: #94a3b8; }
.ac-clear {
  position: absolute;
  right: 9px; top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #94a3b8;
  font-size: 18px;
  line-height: 1;
  padding: 2px;
  display: none;
  transition: color 0.1s;
}
.ac-clear:hover { color: #475569; }

/* ── Dropdown ──────────────────────────── */
.ac-dropdown {
  position: absolute;
  top: calc(100% + 5px);
  left: 0; right: 0;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 10px 36px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
  z-index: 99999;
  overflow: hidden;
  display: none;
}

/* Loading state */
.ac-loading {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: #64748b;
  font-size: 12.5px;
}
.ac-spinner {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 0.55s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty */
.ac-empty {
  padding: 12px 14px;
  color: #94a3b8;
  font-size: 12.5px;
  text-align: center;
}

/* Suggestion item */
.ac-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
  transition: background 0.1s;
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.active {
  background: #eff6ff;
}
.ac-item-icon {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 7px;
  background: #eff6ff;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.ac-item-text {
  flex: 1;
  font-size: 13.5px;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ac-item-text em {
  font-style: normal;
  font-weight: 700;
  color: #2563eb;
}
.ac-item-arrow {
  flex-shrink: 0;
  color: #94a3b8;
  font-size: 13px;
  transform: rotate(-45deg);
  display: inline-block;
}
</style>
</head>
<body>
<div id="root" style="position:relative">
  <span class="ac-label" id="lbl"></span>
  <div class="ac-input-row">
    <input class="ac-input" id="inp" type="text" autocomplete="off" spellcheck="false" />
    <button class="ac-clear" id="clr" tabindex="-1">&#215;</button>
    <div class="ac-dropdown" id="drop"></div>
  </div>
</div>

<script>
(function () {
  // ── State ──────────────────────────────────────────────────────────────────
  var inp         = document.getElementById('inp');
  var clr         = document.getElementById('clr');
  var drop        = document.getElementById('drop');
  var lbl         = document.getElementById('lbl');

  var suggestions = [];   // current suggestions array from Python
  var activeIdx   = -1;   // keyboard-selected row index
  var dropVisible = false;
  var isLoading   = false; // waiting for suggestions from Python
  var debTimer    = null;
  var lastSent    = '';    // last value sent to Streamlit

  var DEBOUNCE_MS = 500;
  var MIN_CHARS   = 4;

  // ── Streamlit messaging ────────────────────────────────────────────────────
  function postMsg(type, payload) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), '*');
  }

  function sendValue(text, selected) {
    postMsg('streamlit:setComponentValue', {
      value: { text: text, selected: !!selected },
      dataType: 'json'
    });
  }

  function resizeFrame() {
    var baseH = document.getElementById('root').getBoundingClientRect().height;
    // When dropdown is visible, make room; absolute-positioned so doesn't affect scrollHeight
    var dropH = (dropVisible && drop.style.display !== 'none') ? (drop.scrollHeight + 6) : 0;
    postMsg('streamlit:setFrameHeight', { height: Math.max(58, Math.ceil(baseH + dropH + 2)) });
  }

  // ── Highlight matching text ────────────────────────────────────────────────
  function highlight(text, query) {
    if (!query) return escHtml(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) return escHtml(text);
    return escHtml(text.slice(0, idx))
      + '<em>' + escHtml(text.slice(idx, idx + query.length)) + '</em>'
      + escHtml(text.slice(idx + query.length));
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Render dropdown ────────────────────────────────────────────────────────
  function renderDrop() {
    if (!dropVisible) {
      drop.style.display = 'none';
      resizeFrame();
      return;
    }
    drop.style.display = 'block';

    if (isLoading) {
      drop.innerHTML =
        '<div class="ac-loading"><div class="ac-spinner"></div>Looking up suggestions…</div>';
      resizeFrame();
      return;
    }

    if (!suggestions.length) {
      drop.innerHTML = '<div class="ac-empty">No matching suggestions</div>';
      resizeFrame();
      return;
    }

    var q = inp.value.trim();
    drop.innerHTML = suggestions.map(function (s, i) {
      return '<div class="ac-item' + (i === activeIdx ? ' active' : '') + '" data-i="' + i + '">'
        + '<div class="ac-item-icon">📦</div>'
        + '<div class="ac-item-text">' + highlight(s, q) + '</div>'
        + '<div class="ac-item-arrow">&#8599;</div>'
        + '</div>';
    }).join('');

    drop.querySelectorAll('.ac-item').forEach(function (el) {
      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        pick(suggestions[parseInt(el.dataset.i)]);
      });
    });

    resizeFrame();
  }

  function pick(val) {
    inp.value   = val;
    clr.style.display = 'block';
    dropVisible = false;
    isLoading   = false;
    suggestions = [];
    activeIdx   = -1;
    renderDrop();
    sendValue(val, true);
  }

  // ── Input events ───────────────────────────────────────────────────────────
  inp.addEventListener('input', function () {
    var v = inp.value;
    clr.style.display = v ? 'block' : 'none';
    clearTimeout(debTimer);

    if (v.length < MIN_CHARS) {
      dropVisible = false;
      isLoading   = false;
      suggestions = [];
      renderDrop();
      if (v !== lastSent) {
        lastSent = v;
        sendValue(v, false);
      }
      return;
    }

    // Show loading immediately, debounce actual send
    dropVisible = true;
    isLoading   = true;
    activeIdx   = -1;
    renderDrop();

    debTimer = setTimeout(function () {
      isLoading = false;   // will be updated when Python sends back suggestions
      lastSent  = v;
      sendValue(v, false);
    }, DEBOUNCE_MS);
  });

  inp.addEventListener('keydown', function (e) {
    if (!dropVisible || !suggestions.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, suggestions.length - 1);
      renderDrop();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, -1);
      renderDrop();
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      pick(suggestions[activeIdx]);
    } else if (e.key === 'Escape') {
      dropVisible = false;
      renderDrop();
    }
  });

  inp.addEventListener('blur', function () {
    setTimeout(function () {
      dropVisible = false;
      renderDrop();
    }, 160);
  });

  inp.addEventListener('focus', function () {
    if (suggestions.length && inp.value.length >= MIN_CHARS) {
      dropVisible = true;
      renderDrop();
    }
  });

  clr.addEventListener('click', function () {
    inp.value   = '';
    clr.style.display = 'none';
    dropVisible = false;
    isLoading   = false;
    suggestions = [];
    activeIdx   = -1;
    renderDrop();
    lastSent    = '';
    sendValue('', false);
  });

  // ── Streamlit → component messages ────────────────────────────────────────
  window.addEventListener('message', function (event) {
    var msg = event.data || {};
    if (msg.type !== 'streamlit:render') return;
    var args = msg.args || {};

    // Label / placeholder
    var newLabel = args.label || '';
    if (lbl.textContent !== newLabel) lbl.textContent = newLabel;
    var ph = args.placeholder || '';
    if (inp.placeholder !== ph) inp.placeholder = ph;

    // Value: only update input if Python is pushing a new value (e.g. on form reset)
    var pythonVal = args.value !== undefined ? String(args.value) : null;
    if (pythonVal !== null && pythonVal !== inp.value) {
      inp.value         = pythonVal;
      clr.style.display = pythonVal ? 'block' : 'none';
      // If input was cleared by form reset, close dropdown
      if (!pythonVal) {
        dropVisible = false;
        isLoading   = false;
        suggestions = [];
      }
    }

    // Suggestions from Python
    var newSuggs = Array.isArray(args.suggestions) ? args.suggestions : [];
    var changed  = JSON.stringify(newSuggs) !== JSON.stringify(suggestions);
    if (changed) {
      suggestions = newSuggs;
      activeIdx   = -1;
      isLoading   = false;
      // Only open drop if input still has enough chars
      if (inp.value.length >= MIN_CHARS) {
        dropVisible = true;
      }
    }

    renderDrop();
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  postMsg('streamlit:componentReady', { apiVersion: 1 });
  postMsg('streamlit:setFrameHeight', { height: 58 });

  if (window.ResizeObserver) {
    new ResizeObserver(resizeFrame).observe(document.getElementById('root'));
  }
})();
</script>
</body>
</html>
