<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: transparent;
  overflow: visible;
}

.ac-label {
  display: block;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ac-input-row {
  position: relative;
}
.ac-input {
  width: 100%;
  padding: 9px 34px 9px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 14px;
  color: #0f172a;
  background: #fff;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.ac-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.ac-input::placeholder { color: #94a3b8; }
.ac-clear {
  position: absolute;
  right: 9px; top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #94a3b8;
  font-size: 18px;
  line-height: 1;
  padding: 2px;
  display: none;
  transition: color 0.1s;
}
.ac-clear:hover { color: #475569; }

.ac-dropdown {
  position: absolute;
  top: calc(100% + 5px);
  left: 0; right: 0;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 10px 36px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
  z-index: 99999;
  overflow: hidden;
  display: none;
}

.ac-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
  transition: background 0.1s;
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.active { background: #eff6ff; }
.ac-item-icon {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 7px;
  background: #eff6ff;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.ac-item-text {
  flex: 1;
  font-size: 13.5px;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ac-item-text em {
  font-style: normal;
  font-weight: 700;
  color: #2563eb;
}
.ac-item-arrow {
  flex-shrink: 0;
  color: #94a3b8;
  font-size: 13px;
  transform: rotate(-45deg);
  display: inline-block;
}
</style>
</head>
<body>
<div id="root" style="position:relative">
  <span class="ac-label" id="lbl"></span>
  <div class="ac-input-row">
    <input class="ac-input" id="inp" type="text" autocomplete="off" spellcheck="false" />
    <button class="ac-clear" id="clr" tabindex="-1">&#215;</button>
    <div class="ac-dropdown" id="drop"></div>
  </div>
</div>

<script>
(function () {
  var inp         = document.getElementById('inp');
  var clr         = document.getElementById('clr');
  var drop        = document.getElementById('drop');
  var lbl         = document.getElementById('lbl');

  var allSuggestions = [];  // full list from Python — never changes during a page
  var filtered       = [];  // client-side filtered view
  var activeIdx      = -1;
  var dropVisible    = false;
  var lastSent       = null;  // last value posted to Python (dedup blur sends)

  var MIN_CHARS = 2;
  var MAX_SHOW  = 8;

  // ── Streamlit helpers ──────────────────────────────────────────────────────
  function postMsg(type, payload) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), '*');
  }

  function sendValue(text, selected) {
    lastSent = text;
    postMsg('streamlit:setComponentValue', {
      value: { text: text, selected: selected },
      dataType: 'json'
    });
  }

  function sendSelected(text) {
    sendValue(text, true);  // user picked a suggestion
  }

  function resizeFrame() {
    var baseH = document.getElementById('root').getBoundingClientRect().height;
    var dropH = (dropVisible && drop.style.display !== 'none') ? (drop.scrollHeight + 6) : 0;
    postMsg('streamlit:setFrameHeight', { height: Math.max(58, Math.ceil(baseH + dropH + 2)) });
  }

  // ── Client-side filtering ─────────────────────────────────────────────────
  function computeFiltered(query) {
    if (!query || query.length < MIN_CHARS) return [];
    var q = query.toLowerCase();
    var starts = [], contains = [];
    for (var i = 0; i < allSuggestions.length; i++) {
      var s = allSuggestions[i];
      if (!s) continue;
      var sl = s.toLowerCase();
      if (sl.startsWith(q)) starts.push(s);
      else if (sl.indexOf(q) >= 0) contains.push(s);
      if (starts.length + contains.length >= MAX_SHOW) break;
    }
    return starts.concat(contains).slice(0, MAX_SHOW);
  }

  // ── Highlight matching text ────────────────────────────────────────────────
  function highlight(text, query) {
    if (!query) return escHtml(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) return escHtml(text);
    return escHtml(text.slice(0, idx))
      + '<em>' + escHtml(text.slice(idx, idx + query.length)) + '</em>'
      + escHtml(text.slice(idx + query.length));
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Render dropdown ────────────────────────────────────────────────────────
  function renderDrop() {
    if (!dropVisible || !filtered.length) {
      drop.style.display = 'none';
      resizeFrame();
      return;
    }
    drop.style.display = 'block';
    var q = inp.value.trim();
    drop.innerHTML = filtered.map(function (s, i) {
      return '<div class="ac-item' + (i === activeIdx ? ' active' : '') + '" data-i="' + i + '">'
        + '<div class="ac-item-icon">📦</div>'
        + '<div class="ac-item-text">' + highlight(s, q) + '</div>'
        + '<div class="ac-item-arrow">&#8599;</div>'
        + '</div>';
    }).join('');

    drop.querySelectorAll('.ac-item').forEach(function (el) {
      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        pick(filtered[parseInt(el.dataset.i)]);
      });
    });
    resizeFrame();
  }

  function pick(val) {
    inp.value = val;
    clr.style.display = 'block';
    dropVisible = false;
    filtered    = [];
    activeIdx   = -1;
    renderDrop();
    sendSelected(val);  // only time we notify Python
  }

  // ── Input events — all filtering is local, no Python round-trips ──────────
  inp.addEventListener('input', function () {
    var v = inp.value;
    clr.style.display = v ? 'block' : 'none';
    filtered    = computeFiltered(v);
    activeIdx   = -1;
    dropVisible = filtered.length > 0;
    renderDrop();
  });

  inp.addEventListener('keydown', function (e) {
    if (!dropVisible || !filtered.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, filtered.length - 1);
      renderDrop();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, -1);
      renderDrop();
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      pick(filtered[activeIdx]);
    } else if (e.key === 'Escape') {
      dropVisible = false;
      renderDrop();
    }
  });

  inp.addEventListener('blur', function () {
    setTimeout(function () {
      dropVisible = false;
      renderDrop();
      // Commit typed text that was never picked from the dropdown, so Python
      // captures free-form entries (e.g. a brand-new model name).
      if (inp.value !== lastSent) {
        sendValue(inp.value, false);
      }
    }, 160);
  });

  inp.addEventListener('focus', function () {
    if (inp.value.length >= MIN_CHARS) {
      filtered    = computeFiltered(inp.value);
      dropVisible = filtered.length > 0;
      renderDrop();
    }
  });

  clr.addEventListener('click', function () {
    inp.value   = '';
    clr.style.display = 'none';
    dropVisible = false;
    filtered    = [];
    activeIdx   = -1;
    renderDrop();
    sendSelected('');
  });

  // ── Streamlit → component ─────────────────────────────────────────────────
  window.addEventListener('message', function (event) {
    var msg = event.data || {};
    if (msg.type !== 'streamlit:render') return;
    var args = msg.args || {};

    var newLabel = args.label || '';
    if (lbl.textContent !== newLabel) lbl.textContent = newLabel;
    var ph = args.placeholder || '';
    if (inp.placeholder !== ph) inp.placeholder = ph;

    // Update full suggestion list from Python (happens once on load / after selection)
    var newAll = Array.isArray(args.suggestions) ? args.suggestions : [];
    if (newAll.length !== allSuggestions.length) {
      allSuggestions = newAll;
    }

    // Sync value from Python — but never overwrite user's typed text with empty.
    // Python sends value="" until user selects a suggestion; don't wipe what user typed.
    var pythonVal = args.value !== undefined ? String(args.value) : null;
    if (pythonVal !== null && pythonVal !== inp.value) {
      if (pythonVal || !inp.value) {   // only update if Python has content OR input is empty
        inp.value         = pythonVal;
        clr.style.display = pythonVal ? 'block' : 'none';
        if (!pythonVal) {
          dropVisible = false;
          filtered    = [];
        }
        renderDrop();
      }
    }
    // Seed the dedup baseline once so an untouched field never posts on blur.
    if (lastSent === null) lastSent = inp.value || '';
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  postMsg('streamlit:componentReady', { apiVersion: 1 });
  postMsg('streamlit:setFrameHeight', { height: 58 });

  if (window.ResizeObserver) {
    new ResizeObserver(resizeFrame).observe(document.getElementById('root'));
  }
})();
</script>
</body>
</html>
